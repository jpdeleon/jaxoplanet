name: jaxoplanet2

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAX_ENABLE_X64: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: ruff check
        run: uvx ruff check src/jaxoplanet2 tests/jaxoplanet2
      - name: ruff format
        run: uvx ruff format --check src/jaxoplanet2 tests/jaxoplanet2

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs tags for the version
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[test]" pytest-cov
      - name: CLI smoke test
        run: uv run --no-project jaxoplanet --help
      - name: Tests (with coverage gate)
        run: >
          uv run --no-project pytest tests/jaxoplanet2
          --cov=jaxoplanet2 --cov-report=term-missing --cov-fail-under=80

  slow-tests:
    runs-on: ubuntu-latest
    needs: tests
    env:
      JAXOPLANET2_SLOW: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[test]"
      - name: Slow tests (end-to-end fits)
        run: uv run --no-project pytest tests/jaxoplanet2 -m slow

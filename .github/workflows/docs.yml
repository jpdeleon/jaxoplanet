name: docs

# Build the MkDocs site on every PR (strict: warnings fail) and deploy it to
# GitHub Pages (https://jpdeleon.github.io/jaxoplanet2/) from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs tags for the version
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[mkdocs]"
      - name: Build (strict)
        run: uv run --no-project mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

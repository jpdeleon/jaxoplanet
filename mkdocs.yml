site_name: jaxoplanet2
site_description: allesfitter-style transit and RV fitting, powered by jaxoplanet
site_url: https://jpdeleon.github.io/jaxoplanet2/
repo_url: https://github.com/jpdeleon/jaxoplanet2
repo_name: jpdeleon/jaxoplanet2
edit_uri: edit/main/docs/
docs_dir: docs
# tutorials/: local, untracked notebooks; gen_pages.py: build script, not a page
exclude_docs: |
  tutorials/
  gen_pages.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Parameters: parameters.md
  - Examples:
      - Kepler-1627 b (transit + GP): examples/kepler1627.md
  - CLI reference: cli.md
  - API reference: api/
  - Design plan: plans/cli-fitter.md
  - jaxoplanet library docs: https://jax.exoplanet.codes

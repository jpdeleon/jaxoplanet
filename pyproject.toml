[project]
name = "jaxoplanet2"
description = "allesfitter-style transit and RV fitting on a jaxoplanet hard fork"
authors = [
    { name = "Dan Foreman-Mackey", email = "foreman.mackey@gmail.com" },
    { name = "Jerome de Leon", email = "jpdeleon.bsap@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT License" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = ["jax",
                "jaxlib",
                "equinox",
                ]

[project.urls]
"Homepage" = "https://github.com/jpdeleon/jaxoplanet2"
"Source" = "https://github.com/jpdeleon/jaxoplanet2"
"Bug Tracker" = "https://github.com/jpdeleon/jaxoplanet2/issues"
"Upstream" = "https://github.com/exoplanet-dev/jaxoplanet"

[project.optional-dependencies]
dev = [
    "nox",
    "ruff",
    "black",
    "pre-commit",
    "pytest",
    "sympy",
    "mpmath",
    "gmpy2",
    "astropy"
]
test = ["pytest", "pytest-xdist", "exoplanet-core", "batman-package", "radvel", "orbitize"]
test-math = ["mpmath", "gmpy2"]
docs = [
    "matplotlib",
    "arviz[matplotlib]>=1.0",
    "corner",
    "numpyro>=0.21",
    "numpyro-ext",
    "jaxopt",
    "myst-nb",
    "sphinx-book-theme",
    "sphinx-design",
    "sphinx-autoapi",
    "ipywidgets",
    "astropy"
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# jaxoplanet2 releases are tagged jaxoplanet2-vX.Y.Z so they never mix with the
# upstream vX.Y.Z tags inherited by this fork.
raw-options = { tag_regex = "^jaxoplanet2-v(?P<version>.*)$", git_describe_command = "git describe --dirty --tags --long --match jaxoplanet2-v*" }

[tool.hatch.build.hooks.vcs]
version-file = "src/jaxoplanet/jaxoplanet_version.py"

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.ruff]
line-length = 89
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I", "E", "W", "YTT", "B", "Q", "PLE", "PLR", "PLW", "UP"]
ignore = [
    "B023",    # Allow using global variables in lambdas
    "E741",    # Allow ambiguous variable names (e.g. "l" in starry)
    "PLR0912", # Allow many branches
    "PLR0913", # Allow many arguments in function call
    "PLR0915", # Allow many statements
    "PLR2004", # Allow magic numbers in comparisons
]
# exclude = []

[tool.ruff.lint.isort]
known-first-party = ["jaxoplanet"]
combine-as-imports = true
